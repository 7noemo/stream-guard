name: Build Stream Guard Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller stream-guard.spec --noconfirm --clean

      - name: Copy config next to exe
        run: Copy-Item -Path config.json -Destination dist\config.json -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamGuard-windows
          path: |
            dist\StreamGuard.exe
            dist\config.json
          if-no-files-found: error
